# Pipeline d'intégration continue (CI) exécuté automatiquement sur GitHub Actions
name: OptiStack CI

on:
  # Déclenchement sur les branches principales et de fonctionnalités
  push:
    branches: [main, "feat/**", "feature/**", "chore/**"]
  # Déclenchement systématique avant fusion d'une Pull Request vers main
  pull_request:
    branches: [main]

jobs:
  # 1. Contrôle qualité transverse (YAML, espaces superflus, fins de fichier)
  pre-commit:
    name: Quality Hooks (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and run pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files

  # 2. Suite de tests backend avec exigence minimale de couverture > 70% (CONTRIBUTING.md)
  backend:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Run pytest with >70% coverage threshold
        run: pytest tests -v --cov=app --cov-report=term-missing --cov-fail-under=70

  # 3. Validation frontend : formatage Prettier, règles ESLint et build Vite de production
  frontend:
    name: Frontend Format, Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check Prettier formatting
        run: npx prettier --check "src/**/*.{js,jsx,css}"
      - name: Run ESLint
        run: npm run lint
      - name: Build production bundle
        run: npm run build

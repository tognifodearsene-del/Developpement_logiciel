# Stack locale de base de données pour OptiStack (environnement de développement)
version: '3.8'

services:
  db:
    image: postgres:14-alpine
    environment:
      # Identifiants alignés sur .env.example pour le développement local
      POSTGRES_USER: optistack
      POSTGRES_PASSWORD: secure_dev_password
      POSTGRES_DB: optistack_db
    volumes:
      # Persistance des données PostgreSQL entre deux redémarrages du conteneur
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      # Vérifie explicitement la base optistack_db pour éviter les faux logs d'erreur
      test: ["CMD-SHELL", "pg_isready -U optistack -d optistack_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    container_name: optistack-postgres
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

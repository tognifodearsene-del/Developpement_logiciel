version: '3.8'

services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: optistack
      POSTGRES_PASSWORD: secure_dev_password
      POSTGRES_DB: optistack_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - \"5432:5432\"
    healthcheck:
      test: [\"CMD-SHELL\", \"pg_isready -U optistack\"]
      interval: 10s
      timeout: 5s
      retries: 5
    container_name: optistack-postgres
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
